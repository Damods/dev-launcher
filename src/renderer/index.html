<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self';">
  <title>Dev Launcher</title>
  <script src="theme-bootstrap.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="themeTransitionLayer" class="theme-transition-layer" aria-hidden="true"></div>
  <div class="app-window">
    <header id="windowTitlebar" class="window-titlebar">
      <div class="titlebar-brand">
        <img src="../../assets/icon-32.png" alt="">
        <span>Dev Launcher</span>
      </div>
      <div class="titlebar-drag-space"></div>
      <div class="titlebar-actions">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换到暗黑模式" title="切换到暗黑模式">
          <i class="theme-icon theme-icon-moon" data-lucide="moon" aria-hidden="true"></i>
          <i class="theme-icon theme-icon-sun" data-lucide="sun" aria-hidden="true"></i>
        </button>
        <div class="window-controls" aria-label="窗口控制">
          <button class="window-control" data-window-control="minimize" aria-label="最小化窗口" title="最小化"><i data-lucide="minus" aria-hidden="true"></i></button>
          <button class="window-control" data-window-control="maximize" aria-label="最大化或还原窗口" title="最大化或还原"><i class="maximize-icon" data-lucide="square" aria-hidden="true"></i><i class="restore-icon" data-lucide="copy" aria-hidden="true"></i></button>
          <button class="window-control close" data-window-control="close" aria-label="关闭窗口" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
        </div>
      </div>
    </header>

    <div class="app-shell">
      <aside class="navigation-sidebar">
        <div class="sidebar-brand"><img class="brand-mark" src="../../assets/icon.png" alt=""><div><strong>Dev Launcher</strong><span>本地开发控制台</span></div></div>
        <nav id="mainNav" class="sidebar-nav" aria-label="主要导航">
          <button class="nav-item active" data-view="projects"><i data-lucide="layout-grid" aria-hidden="true"></i><span>全部项目</span><em id="projectCount">0</em></button>
          <button class="nav-item" data-view="groups"><i data-lucide="play" aria-hidden="true"></i><span>启动组</span><em id="groupCount">0</em></button>
          <div class="nav-separator"></div>
          <div class="root-nav-row">
            <button class="nav-item root-nav-item" data-view="roots"><i data-lucide="folder-code" aria-hidden="true"></i><span>代码目录</span><em id="rootCount">0</em></button>
            <button class="root-tree-toggle" type="button" data-action="toggle-root-tree" aria-expanded="true" aria-controls="sidebarRootTree" aria-label="收起代码目录列表" title="收起代码目录列表"><i class="root-tree-chevron" data-lucide="chevron-up" aria-hidden="true"></i></button>
          </div>
          <div id="sidebarRootTree" class="sidebar-root-tree"></div>
          <div class="nav-separator"></div>
          <button class="nav-item" data-view="settings"><i data-lucide="settings" aria-hidden="true"></i><span>设置</span></button>
        </nav>
        <section class="sidebar-running-card">
          <div class="sidebar-running-header"><span>运行中</span><strong id="runningCount">0</strong></div>
          <div id="sidebarRunningList" class="sidebar-running-list"><small>暂无运行项目</small></div>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div><h1 id="pageTitle">全部项目</h1><p id="pageSubtitle">集中启动和管理本地开发服务</p></div>
          <div class="top-actions">
            <button id="stopAllBtn" class="button ghost danger"><i data-lucide="square" aria-hidden="true"></i>全部停止</button>
            <button id="scanBtn" class="button secondary"><i data-lucide="rotate-cw" aria-hidden="true"></i>重新扫描</button>
            <button id="addRootBtn" class="button primary"><i data-lucide="folder-plus" aria-hidden="true"></i>添加代码目录</button>
          </div>
        </header>
        <section id="toolbar" class="workspace-toolbar">
          <label class="search-box"><i data-lucide="search" aria-hidden="true"></i><input id="searchInput" type="search" placeholder="搜索项目名称或路径" aria-label="搜索项目名称或路径"></label>
          <div class="filter-row">
            <select id="typeFilter" aria-label="项目类型"><option value="all">全部类型</option><option value="maven">Maven</option><option value="gradle">Gradle</option><option value="frontend">前端</option></select>
            <select id="statusFilter" aria-label="运行状态"><option value="all">全部状态</option><option value="running">正在运行</option><option value="idle">未运行</option><option value="issue">需要处理</option></select>
          </div>
        </section>
        <div class="content-grid">
          <section id="content" class="content"></section>
          <aside id="detailPanel" class="detail-panel hidden"></aside>
        </div>
      </main>
    </div>
  </div>

  <dialog id="projectDialog" class="modal wide-modal" aria-labelledby="projectDialogTitle" aria-describedby="projectDialogDescription">
    <form id="projectForm" method="dialog">
      <div class="modal-header"><div><h2 id="projectDialogTitle">编辑启动配置</h2><p id="projectDialogDescription">自定义内容不会被重新扫描覆盖</p></div><button type="button" class="icon-button" data-close="projectDialog" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <input id="editProjectId" type="hidden">
      <div class="form-grid">
        <label class="field"><span>项目名称</span><input id="editName" required autofocus></label>
        <label class="field"><span>日志编码</span><select id="editEncoding"><option value="auto">自动判断</option><option value="utf8">UTF-8</option><option value="system">系统编码</option></select></label>
        <label class="field full"><span>项目目录</span><input id="editPath" disabled></label>
        <label class="field full"><span>工作目录</span><input id="editWorkingDirectory" required></label>
        <label class="field"><span>启动命令</span><input id="editCommand" required placeholder="例如 npm.cmd"></label>
        <label class="field"><span>命令参数</span><input id="editArgs" placeholder="例如 run dev"></label>
        <label class="field full"><span>固定网页地址（可选）</span><input id="editUrl" type="url" placeholder="http://localhost:3000"></label>
      </div>
      <div class="env-header"><div><strong>环境变量</strong><span>值默认遮挡，并使用 Windows 安全存储加密</span></div><button id="addEnvBtn" type="button" class="button small secondary"><i data-lucide="plus" aria-hidden="true"></i>添加变量</button></div>
      <div id="envRows" class="env-list"></div>
      <label class="checkbox-row"><input id="editVisible" type="checkbox" checked>在项目列表中显示</label>
      <div class="modal-actions"><button id="restoreProjectBtn" type="button" class="button ghost">恢复自动配置</button><span></span><button type="button" class="button ghost" data-close="projectDialog">取消</button><button type="submit" class="button primary">保存配置</button></div>
    </form>
  </dialog>

  <dialog id="groupDialog" class="modal" aria-labelledby="groupDialogTitle" aria-describedby="groupDialogDescription">
    <form id="groupForm" method="dialog">
      <div class="modal-header"><div><h2 id="groupDialogTitle">新建启动组</h2><p id="groupDialogDescription">组内项目将并行启动</p></div><button type="button" class="icon-button" data-close="groupDialog" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <input id="editGroupId" type="hidden">
      <label class="field"><span>启动组名称</span><input id="editGroupName" required autofocus placeholder="例如 商城前后端"></label>
      <div class="field"><span>选择项目</span><div id="groupProjectList" class="check-list"></div><p id="groupProjectError" class="field-error hidden" role="alert">请至少选择一个项目</p></div>
      <div class="modal-actions"><span></span><span></span><button type="button" class="button ghost" data-close="groupDialog">取消</button><button type="submit" class="button primary">保存启动组</button></div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="modal confirm-modal" aria-labelledby="confirmDialogTitle" aria-describedby="confirmDialogMessage">
    <div class="confirm-dialog-body">
      <div id="confirmDialogIcon" class="confirm-dialog-icon"><i data-lucide="triangle-alert" aria-hidden="true"></i></div>
      <div class="confirm-dialog-copy">
        <h2 id="confirmDialogTitle">确认操作</h2>
        <p id="confirmDialogMessage"></p>
      </div>
      <div class="confirm-dialog-actions">
        <button id="confirmCancelBtn" type="button" class="button secondary" autofocus>取消</button>
        <button id="confirmSubmitBtn" type="button" class="button danger-solid">确认</button>
      </div>
    </div>
  </dialog>

  <div id="paletteOverlay" class="palette-overlay hidden">
    <div class="palette" role="dialog" aria-modal="true" aria-label="命令面板">
      <div class="palette-input-row"><i data-lucide="search" aria-hidden="true"></i><input id="paletteInput" placeholder="搜索项目或命令…" aria-label="搜索项目或命令"><kbd>Esc</kbd></div>
      <div id="paletteList" class="palette-list" role="listbox"></div>
    </div>
  </div>

  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <script src="vendor/lucide.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
